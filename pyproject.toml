[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxmatrix"
version = "0.1.0"
description = "Z3 proof-gated model matrix on GMI Cloud AgentBox, driven from Factory Droid"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "z3-solver>=4.13", "typer>=0.12", "rich>=13", "cryptography>=42", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
boxmatrix = "boxmatrix.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
boxmatrix = ["tasks/*.json", "policies/*.toml", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs real GMI keys and spends a few cents (set BOXMATRIX_LIVE=1)"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/boxmatrix/mock_data.py" = ["E501"]
"src/boxmatrix/attacks.py" = ["E501"]
